
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malla Interactiva | Administración</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Licenciatura en Administración</h1>
    <p>Malla curricular interactiva</p>
  </header>

  <main>
    <section id="progreso">
      <h2>Mi progreso académico</h2>
      <p>Materias aprobadas: <span id="aprobadas">0</span></p>
      <p>Materias regulares: <span id="regulares">0</span></p>
      <p>Progreso de la carrera: <span id="porcentaje">0%</span></p>
    </section>

    <section id="malla">
      <h2>Plan de estudios</h2>
      <p>Próximamente aparecerán aquí las materias organizadas por año.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
